<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">   
    <title>Gestor de Tareas</title>
</head>

<body>
    <div id="global-wrapper">
    
    
    <aside class="sidebar"> 
        sidebar
    </aside>
    <main>
        <h1>Gestor de Tareas</h1>
        <header class="top-bar"> 


            <label for="desplegable">Elige una opción:</label>
        
            <select id="desplegable">
                <option value="todo">todo</option>
                <option value="terminado">terminado</option>
                <option value="proceso">En proceso</option>
                <option value="pendiente">Pendiente</option>
            </select>
            <button id="new-task">+Añadir Tarea</button>
            <div id="modal-task" class="hidden-task">
                <div id="cont-task">
                    <h2>Nueva tarea</h2>
                    <form id="form-tarea">
                        <input type="text" id="titulo-task" placeholder="Titulo de la Tarea..." required>
                        <textarea id="descripcion-task" placeholder="Descripcion...."></textarea>
                        <label>Prioridad</label>
                        <select id="prioridad-task">
                            <option value="baja">Baja</option>
                            <option value="media">Media</option>
                            <option value="urgente">Urgente</option>
                        </select>
                        <div id="acciones-task">
                            <button id="cerrar-modal">Cancelar</button>
                            <button type="submit">Guardar Tarea</button>
                        </div>
                    </form>
                </div>
            </div>
        </header>
        <section id="tablero">
            
        </section>
    </main>
    <script src="script.js"></script>  
    </div>
</body>
</html>
