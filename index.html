<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">   
    <title>Gestor de Tareas</title>
</head>

<body>
    <div id="global-wrapper">
    
    
    <aside class="sidebar"> 
        sidebar
    </aside>
    <main>
        <h1>Gestor de Archivos</h1>
        <header class="top-bar"> 


        <label for="desplegable">Elige una opción:</label>
        
            <select id="desplegable">
                <option value="todo">todo</option>
                <option value="terminado">terminado</option>
                <option value="proceso">En proceso</option>
                <option value="pendiente">Pendiente</option>
            </select>
        </header>
        <section id="tablero">
            <!-- Tarjeta de prueba -->
            <article class="tarjeta-tarea">
                <span class="etiqueta-prioridad urgente">Urgente</span>
                <h3>Terminar el login</h3>
                <p>Configurar la validación del formulario de acceso.</p>
                <div class="footer-tarjeta">
                    <span class="fecha">05 May</span>
                    <button class="btn-eliminar">🗑️</button>
                </div>
            </article>
        </section>
    </main>
    <script src="script.js"></script>  
    </div>
</body>
</html>
